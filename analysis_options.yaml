analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Published API: every public member is documented (pub.dev scores this).
    public_member_api_docs: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

# Shared by every Dart package in this repo, so `dart format .` is stable.
formatter:
  page_width: 100
