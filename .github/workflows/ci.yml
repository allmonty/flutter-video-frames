name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Dart, Kotlin unit tests and formatting.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: flutter
        # Same Flutter as local development (.tool-versions, e.g. "flutter 3.47.5-stable").
        run: echo "version=$(awk '/^flutter/{print $2}' .tool-versions | sed 's/-stable$//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      # Pigeon's generated files keep the generator's formatting.
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - run: flutter test
      - working-directory: example
        run: flutter pub get && flutter analyze && flutter test
      # gradlew is generated by Flutter (its template gitignores it), so create it first.
      - working-directory: example
        run: flutter build apk --config-only
      - working-directory: example/android
        run: ./gradlew :video_frames:testDebugUnitTest

  # GitHub's macOS runners are VMs without the Mac's media engine, so video
  # encoding never starts there: run the Swift checks that need no encoder and
  # check that the plugin builds for macOS. Encoding and decoding are covered by
  # running tool/apple_check.sh and the device tests on a real Mac and devices.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: flutter
        run: echo "version=$(awk '/^flutter/{print $2}' .tool-versions | sed 's/-stable$//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: tool/apple_check.sh
        env:
          APPLE_CHECK_NO_ENCODER: '1'
        timeout-minutes: 10
      - working-directory: example
        run: flutter build macos --debug
        timeout-minutes: 20
