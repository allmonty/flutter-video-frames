name: video_frames
description: "Decode video frames to RGBA and encode RGBA frames to H.264 or HEVC MP4 (audio copied through) on Android and iOS, with no FFmpeg."
version: 0.3.0
repository: https://github.com/allmonty/flutter-video-frames
issue_tracker: https://github.com/allmonty/flutter-video-frames/issues
topics: [video, video-processing, encoding, decoding, ffmpeg-alternative]

environment:
  sdk: ^3.11.1
  # The Android build uses the Flutter 3.47 plugin template (AGP 9).
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.allmonty.video_frames
        pluginClass: VideoFramesPlugin
      ios:
        pluginClass: VideoFramesPlugin
