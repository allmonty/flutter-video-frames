name: video_frames
description: "Decode video frames to RGBA and encode RGBA frames to H.264 or HEVC MP4 (audio copied through) on Android, iOS and macOS, with no FFmpeg."
version: 1.1.1
repository: https://github.com/allmonty/flutter-video-frames
issue_tracker: https://github.com/allmonty/flutter-video-frames/issues
topics: [video, video-processing, encoding, decoding, ffmpeg-alternative]

environment:
  sdk: ^3.11.1
  # The Android build uses the Flutter 3.47 plugin template (AGP 9).
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Imported by Pigeon's generated code (lib/src/messages.g.dart).
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.allmonty.video_frames
        pluginClass: VideoFramesPlugin
      ios:
        pluginClass: VideoFramesPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: VideoFramesPlugin
        sharedDarwinSource: true
